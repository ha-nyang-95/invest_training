[project]
name = "athena-execution"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Athena execution — broker adapter, OrderIntent consumer. Depends on core + feature_store + alpha + ops (NOT orchestrator: DTO interface only)."
dependencies = [
    "athena-core",
    "athena-feature-store",
    "athena-alpha-defense",
    "athena-ops-defense",
    "python-kis>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena"]
only-include = ["athena/execution"]
