[project]
name = "athena-ops-defense"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Athena ops defense — Slippage / Portfolio / Data Quality / Anti-Ego / 4-Layer CB. Depends on core + feature_store."
dependencies = [
    "athena-core",
    "athena-feature-store",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena"]
only-include = ["athena/ops_defense"]
