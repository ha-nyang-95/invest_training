[project]
name = "athena-core"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Athena core — leaf package: BaseDTO, ErrorCode, version, time utilities (no athena-* deps)"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena"]
only-include = ["athena/core"]
