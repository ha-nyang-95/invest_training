[project]
name = "athena-feature-store"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Athena feature store — DuckDB Feature Store, Polars in-memory (depends on athena-core)"
dependencies = [
    "athena-core",
    "polars>=1",
    "duckdb>=1",
    # DuckDB <-> Polars zero-copy bridge (`conn.execute(...).pl()`) uses
    # pyarrow internally. Explicit pin: polars 1.x no longer pulls pyarrow
    # transitively. Story 1.4 AC-2 relies on the bridge in export_hour_shard.
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena"]
only-include = ["athena/feature_store"]
