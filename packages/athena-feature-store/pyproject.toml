[project]
name = "athena-feature-store"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Athena feature store — DuckDB Feature Store, Polars in-memory (depends on athena-core)"
dependencies = [
    "athena-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena"]
only-include = ["athena/feature_store"]
