[project]
name = "athena-orchestrator"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Athena orchestrator — main asyncio decision pipeline. Depends on core + feature_store + alpha + ops."
dependencies = [
    "athena-core",
    "athena-feature-store",
    "athena-alpha-defense",
    "athena-ops-defense",
    "uvloop>=0.22; sys_platform != 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athena"]
only-include = ["athena/orchestrator"]
