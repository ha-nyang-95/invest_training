name: ci-7-stage

# Story 1.3 Task 2 — 7-stage CI pipeline on the self-hosted Trading PC WSL2 runner.
# Replaces Story 1.1's `scaffold-gate` workflow. Stage order matters: each stage
# is a gate in the Athena governance chain, so jobs run strictly serially via
# `needs:` — parallelism would undermine the semantic meaning of the sequence.
#
# AR-INF3 — `runs-on: [self-hosted, trading-pc]`. No `ubuntu-latest`.
# AR-INF4 — 7-stage pipeline: pre-commit → unit → integration → snapshot →
#           walk-forward → 72h cooling → paper replay marker.
# FR57 / NFR-R5 — stage-6 blocks `policy:` commits that have not cooled 72h;
#                 stage-7 requires `paper-replay-ok/<short_sha>` tag.
# Branch protection (Story 1.3 Task 5) references these job names verbatim.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stage-1-pre-commit:
    runs-on: [self-hosted, trading-pc]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for hatch_build.py git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv 0.11.7 (pinned per architecture.md line 192)
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install Python 3.13 (pinned per .python-version)
        run: uv python install 3.13
      - name: Sync workspace (frozen lockfile + dev group)
        run: uv sync --frozen --group dev
      - name: pre-commit (ruff + mypy + hygiene + secret scanner)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: import-linter (layer + forbidden contracts)
        run: uv run lint-imports

  stage-2-pytest-unit:
    needs: stage-1-pre-commit
    runs-on: [self-hosted, trading-pc]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: pytest (unit only, seed-fixed)
        run: uv run pytest -n auto -m "not integration and not snapshot and not walk_forward" -p no:randomly

  stage-3-pytest-integration:
    needs: stage-2-pytest-unit
    runs-on: [self-hosted, trading-pc]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: pytest (integration — mock KIS only, Epic 4/5 populates real)
        run: uv run pytest -n auto -m "integration" -p no:randomly

  stage-4-snapshot-regression:
    needs: stage-3-pytest-integration
    runs-on: [self-hosted, trading-pc]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: pytest (snapshot — Epic 2 Story 2.1 removes SNAPSHOT_FIXTURE_MISSING skip)
        run: uv run pytest -m "snapshot" -p no:randomly

  stage-5-walk-forward-smoke:
    needs: stage-4-snapshot-regression
    runs-on: [self-hosted, trading-pc]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: pytest (walk-forward — Epic 8 Story 8.3 removes WALK_FORWARD_RUNNER_NOT_IMPLEMENTED skip)
        run: uv run pytest -m "walk_forward" -p no:randomly

  stage-6-cooling-gate:
    needs: stage-5-walk-forward-smoke
    runs-on: [self-hosted, trading-pc]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: 72h cooling gate (FR57)
        run: uv run python scripts/check_cooling.py

  stage-7-paper-replay-marker:
    needs: stage-6-cooling-gate
    runs-on: [self-hosted, trading-pc]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --group dev
      - name: paper-replay marker gate (NFR-R5)
        run: uv run python scripts/check_paper_replay_marker.py
