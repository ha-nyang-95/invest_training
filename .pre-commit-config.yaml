# Story 1.1 Task 7 — pre-commit hook chain enforcing AR-CQ1..5 + architecture bans.
# Run order matters: ruff fixes auto-fixable issues first, then mypy/scanners verify.

default_language_version:
  python: python3.13

# Skip generated/external files everywhere.
exclude: |
  (?x)^(
    \.venv/.*|
    _bmad/.*|
    _bmad-output/.*|
    .*/_version\.py|
    build/.*|
    dist/.*
  )$

repos:
  # AR-CQ1: ruff lint + format (architecture bans live in [tool.ruff] of pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # AR-CQ3: mypy strict on packages only (tests excluded by [tool.mypy].exclude in pyproject.toml)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.1
    hooks:
      - id: mypy
        args: [--strict]
        files: ^packages/[^/]+/athena/[^/]+/.*\.py$
        additional_dependencies:
          - pydantic>=2,<3
          - pydantic-settings>=2,<3
          - keyring>=25

  # AR-SEC1 + NFR-S1: never commit secrets/keys. detect-private-key catches PEM
  # headers only; gitleaks scans for API tokens / high-entropy strings / broker
  # creds. Story 1.1 Task 7.3 requires both.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Story 1.3 Task 6 — block policy-file commits without the `policy:` prefix.
  # commit-msg stage: requires `pre-commit install --hook-type commit-msg`.
  - repo: local
    hooks:
      - id: policy-prefix-guard
        name: Detect policy changes that lack `policy:` commit prefix
        entry: uv run python scripts/check_policy_prefix.py
        language: system
        stages: [commit-msg]
        always_run: true
        require_serial: true
